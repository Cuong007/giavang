name: Verify Gold Analyzer

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/update-dukascopy.mjs'
      - 'README.md'
      - '.github/workflows/verify.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline = [s for s in scripts if s.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Expected one inline app script, found {len(inline)}")
          open("/tmp/app.js", "w", encoding="utf-8").write(inline[0])
          PY
          node --check /tmp/app.js
      - name: Save JavaScript syntax diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --check /tmp/app.js > /tmp/syntax-check.log 2>&1 || true
          {
            echo "Workflow run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            cat /tmp/syntax-check.log
          } > .ci-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics.txt
          git commit -m "Record CI syntax diagnostics [skip ci]" || exit 0
          git push
      - name: Check chart library CDN
        run: |
          curl -fsSL --max-time 30 https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o /tmp/lightweight-charts.js
          test -s /tmp/lightweight-charts.js
      - name: Generate and validate Dukascopy-only history
        run: |
          npm install --no-save dukascopy-node
          node scripts/update-dukascopy.mjs
          python - <<'PY'
          import json
          data = json.load(open("data/dukascopy-xauusd.json", encoding="utf-8"))
          bars = data.get("timeframes", {}).get("m1", [])
          if data.get("provider") != "Dukascopy" or data.get("symbol") != "XAUUSD" or len(bars) < 6000:
              raise SystemExit(f"Invalid Dukascopy cache: {data.get('provider')} {data.get('symbol')} {len(bars)}")
          stamps = [x["timestamp"] for x in bars]
          if len(stamps) != len(set(stamps)) or stamps != sorted(stamps):
              raise SystemExit("M1 timestamps are duplicate or unordered")
          for tf in ("m5", "m15", "m30", "h1", "h4", "d1"):
              if not data.get("timeframes", {}).get(tf):
                  raise SystemExit(f"Missing Dukascopy timeframe: {tf}")
          print(f"PASS: {len(bars)} unique M1 candles; all higher timeframes also come from Dukascopy.")
          PY
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real chart rendering in Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gold-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          const failedRequests = [];
          page.on('pageerror', error => errors.push('PAGE: ' + error.message));
          page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
          page.on('requestfailed', req => failedRequests.push(req.url() + ' :: ' + req.failure()?.errorText));
          await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded' });
          try {
            await page.waitForFunction(() => {
              const text = document.getElementById('barCount')?.textContent || '';
              return text.includes('nến') || text.startsWith('Lỗi dữ liệu');
            }, { timeout: 25000 });
          } catch {}
          const remoteHistory = await page.evaluate(async () => {
            try {
              const r = await fetch('/data/dukascopy-xauusd.json?ci=' + Date.now());
              const j = await r.json();
              return { ok: r.ok, count: j.timeframes?.m1?.length || 0, provider: j.provider };
            } catch (e) { return { ok: false, error: String(e) }; }
          });
          console.log('DIAGNOSTIC remote history=' + JSON.stringify(remoteHistory));
          if (!remoteHistory.ok || remoteHistory.count < 6000 || remoteHistory.provider !== 'Dukascopy') throw new Error('Dukascopy 6000-bar cache unavailable: ' + JSON.stringify(remoteHistory));
          const canvasCount = await page.locator('#chart canvas').count();
          const overlayCount = await page.locator('#chartMessage').count();
          const bars = await page.locator('#barCount').innerText();
          const status = await page.locator('#connectionText').innerText();
          console.log('DIAGNOSTIC barCount=' + bars);
          console.log('DIAGNOSTIC connection=' + status);
          console.log('DIAGNOSTIC canvases=' + canvasCount + ', overlay=' + overlayCount);
          console.log('DIAGNOSTIC page errors=' + JSON.stringify(errors));
          console.log('DIAGNOSTIC failed requests=' + JSON.stringify(failedRequests));
          if (!bars.includes('nến')) throw new Error('No candles loaded: ' + bars);
          if (Number.parseInt(bars, 10) < 6000) throw new Error('Expected at least 6000 M1 candles, got: ' + bars);
          if (canvasCount < 1) throw new Error('Chart canvas was not created');
          if (await page.locator('.indicator-chip').count() !== 0) throw new Error('There must be no default indicators in the storage');
          // Full standalone IIFE script: syntax-check and store only; it must NOT execute.
          const standalone = '/* fvg-indicator.js */\n(function(root){ "use strict"; root.FVGIndicator = { init(ctx){ root.__fvgExecuted = true; this.series = ctx.addSeries(root.LightweightCharts.LineSeries, { color: "#e8b65b", lineWidth: 2 }); }, update(bar){ if (this.series) this.series.update({ time: bar.time, value: bar.close }); }, reset(){} }; })(window);';
          await page.locator('#indicatorCode').fill(standalone);
          await page.locator('#addIndicatorBtn').click();
          await page.waitForFunction(() => (document.getElementById('indicatorStatus')?.textContent || '').includes('Đã lưu fvg-indicator.js'));
          const stored = await page.evaluate(() => ({ count: JSON.parse(localStorage.getItem('goldAnalyzerIndicatorScripts') || '[]').length, executed: !!window.__fvgExecuted }));
          if (stored.count !== 1 || stored.executed) throw new Error('Standalone script was not safely stored: ' + JSON.stringify(stored));
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => document.querySelectorAll('.indicator-chip').length === 1);
          if (await page.evaluate(() => !!window.__fvgExecuted)) throw new Error('Stored indicator unexpectedly executed after reload');
          const toggle = page.locator('.indicator-chip button').first();
          if ((await toggle.innerText()) !== 'Kích hoạt') throw new Error('Stored indicator should be inactive by default');
          await toggle.click();
          await page.waitForFunction(() => !!window.__fvgExecuted && document.querySelector('.indicator-chip button')?.textContent === 'Tắt');
          await page.locator('.indicator-chip button').first().click();
          if ((await page.locator('.indicator-chip button').first().innerText()) !== 'Kích hoạt') throw new Error('Indicator did not deactivate');
          await page.locator('.indicator-chip button').last().click();
          if (await page.locator('.indicator-chip').count() !== 0) throw new Error('Stored indicator could not be removed');
          // Exercise the user's VN30 PRO-style API contract: init({chart,series,container}), update(candles,rawCandles,tf).
          const legacy = '/* fvg-indicator.js */\n(function(root){ const api={config:{showDay:true}, init(o){ if(!o.chart || !o.series || !o.container) throw new Error("legacy init context missing"); this.canvas=document.createElement("canvas"); this.canvas.width=o.container.clientWidth; this.canvas.height=o.container.clientHeight; this.canvas.style.cssText="position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none"; o.container.appendChild(this.canvas); this.ctx=this.canvas.getContext("2d"); }, update(candles,raw,tf){ root.__legacyArgs={candles:candles.length,raw:raw.length,tf}; this.ctx.fillStyle="#ff9800"; this.ctx.fillRect(24,24,90,24); }, reset(){}, }; root.FVGIndicator=api; })(window);';
          await page.locator('#indicatorCode').fill(legacy);
          await page.locator('#addIndicatorBtn').click();
          await page.waitForFunction(() => (document.getElementById('indicatorStatus')?.textContent || '').includes('Đã lưu fvg-indicator.js'));
          const legacyRow = page.locator('.indicator-chip').first();
          await legacyRow.locator('button').filter({ hasText: 'Kích hoạt' }).click();
          await page.waitForFunction(() => !!window.__legacyArgs);
          const legacyResult = await page.evaluate(() => {
            const canvas = [...document.querySelectorAll('#chart canvas')].at(-1);
            const pixels = canvas?.getContext('2d')?.getImageData(30, 30, 70, 10).data || [];
            let visible = false; for (let i=3;i<pixels.length;i+=4) if (pixels[i] > 0) { visible=true; break; }
            return { args: window.__legacyArgs, visible, canvasCount: document.querySelectorAll('#chart canvas').length };
          });
          if (!legacyResult.visible || legacyResult.args.raw < 6000 || legacyResult.args.candles < 6000 || legacyResult.args.tf !== '1m') throw new Error('Legacy FVG API did not receive chart data or draw on chart: ' + JSON.stringify(legacyResult));
          await legacyRow.locator('button').filter({ hasText: 'Tắt' }).click();
          if (await page.locator('#chart canvas').count() !== canvasCount) throw new Error('Legacy overlay canvas was not removed on deactivate');
          await page.locator('.indicator-chip').first().locator('button').filter({ hasText: 'Xóa' }).click();
          if (overlayCount !== 0) throw new Error('Chart startup overlay was not removed');
          if (errors.length) throw new Error('Browser errors: ' + errors.join('; '));
          console.log('PASS: Chromium chart; generic indicator lifecycle; legacy FVG API received 6000 M1 bars and painted visible overlay pixels; deactivate removed overlay.');
          await browser.close();
          JS
