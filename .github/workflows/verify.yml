name: Verify Gold Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html, re.I)
          inline = [s for s in scripts if s.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Expected one inline app script, found {len(inline)}")
          open("/tmp/app.js", "w", encoding="utf-8").write(inline[0])
          PY
          node --check /tmp/app.js
      - name: Check chart library CDN
        run: |
          curl -fsSL --max-time 30 https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o /tmp/lightweight-charts.js
          test -s /tmp/lightweight-charts.js
      - name: Check XAUUSD candle API
        run: |
          curl -fsSL --max-time 30 "https://biquote.io/api/XAUUSD/ohlc?interval=1m&limit=5" -o /tmp/xauusd.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/xauusd.json", encoding="utf-8"))
          bars = data.get("bars")
          if data.get("symbol") != "XAUUSD" or not isinstance(bars, list) or not bars:
              raise SystemExit(f"Unexpected OHLC response: {data}")
          required = {"openTime", "open", "high", "low", "close"}
          if not required.issubset(bars[0]):
              raise SystemExit(f"OHLC bar missing fields: {bars[0]}")
          print(f"PASS: {len(bars)} XAUUSD 1m bars received; latest close={bars[0]['close']}")
          PY
      - name: Check latest XAUUSD quote API
        run: |
          curl -fsSL --max-time 30 "https://biquote.io/api/XAUUSD?allowStale=true" -o /tmp/xauusd-quote.json
          python - <<'PY'
          import json
          q = json.load(open("/tmp/xauusd-quote.json", encoding="utf-8"))
          if q.get("symbol") != "XAUUSD" or not isinstance(q.get("mid"), (int, float)):
              raise SystemExit(f"Unexpected quote response: {q}")
          print(f"PASS: XAUUSD quote received; mid={q['mid']}; state={q.get('marketState')}")
          PY
