name: Verify Gold Analyzer

on:
  push:
    branches: [main]
    paths-ignore: ['.ci-diagnostics.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline = [s for s in scripts if s.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Expected one inline app script, found {len(inline)}")
          open("/tmp/app.js", "w", encoding="utf-8").write(inline[0])
          PY
          node --check /tmp/app.js
      - name: Save JavaScript syntax diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --check /tmp/app.js > /tmp/syntax-check.log 2>&1 || true
          {
            echo "Workflow run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            cat /tmp/syntax-check.log
          } > .ci-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics.txt
          git commit -m "Record CI syntax diagnostics [skip ci]" || exit 0
          git push
      - name: Check chart library CDN
        run: |
          curl -fsSL --max-time 30 https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o /tmp/lightweight-charts.js
          test -s /tmp/lightweight-charts.js
      - name: Check XAUUSD candle API
        run: |
          curl -fsSL --max-time 30 "https://biquote.io/api/XAUUSD/ohlc?interval=1m&limit=5" -o /tmp/xauusd.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/xauusd.json", encoding="utf-8"))
          bars = data.get("bars")
          if data.get("symbol") != "XAUUSD" or not isinstance(bars, list) or not bars:
              raise SystemExit(f"Unexpected OHLC response: {data}")
          required = {"openTime", "open", "high", "low", "close"}
          if not required.issubset(bars[0]):
              raise SystemExit(f"OHLC bar missing fields: {bars[0]}")
          print(f"PASS: {len(bars)} XAUUSD 1m bars received; latest close={bars[0]['close']}")
          PY
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real chart rendering in Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gold-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          const failedRequests = [];
          page.on('pageerror', error => errors.push('PAGE: ' + error.message));
          page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE: ' + msg.text()); });
          page.on('requestfailed', req => failedRequests.push(req.url() + ' :: ' + req.failure()?.errorText));
          await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded' });
          try {
            await page.waitForFunction(() => {
              const text = document.getElementById('barCount')?.textContent || '';
              return text.includes('dữ liệu API') || text.startsWith('Lỗi dữ liệu');
            }, { timeout: 25000 });
          } catch {}
          const canvasCount = await page.locator('#chart canvas').count();
          const overlayCount = await page.locator('#chartMessage').count();
          const bars = await page.locator('#barCount').innerText();
          const status = await page.locator('#connectionText').innerText();
          console.log('DIAGNOSTIC barCount=' + bars);
          console.log('DIAGNOSTIC connection=' + status);
          console.log('DIAGNOSTIC canvases=' + canvasCount + ', overlay=' + overlayCount);
          console.log('DIAGNOSTIC page errors=' + JSON.stringify(errors));
          console.log('DIAGNOSTIC failed requests=' + JSON.stringify(failedRequests));
          if (!bars.includes('dữ liệu API')) throw new Error('No candles loaded: ' + bars);
          if (canvasCount < 1) throw new Error('Chart canvas was not created');
          await page.locator('#addIndicatorBtn').click();
          await page.waitForFunction(() => (document.getElementById('indicatorStatus')?.textContent || '').includes('Đã nạp SMA 20'));
          if (await page.locator('.indicator-chip').count() !== 1) throw new Error('SMA 20 JavaScript indicator did not register');
          if (overlayCount !== 0) throw new Error('Chart startup overlay was not removed');
          if (errors.length) throw new Error('Browser errors: ' + errors.join('; '));
          console.log('PASS: Chromium rendered chart with live API candles.');
          await browser.close();
          JS
      - name: Test 6000 one-minute candles with API pagination
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          base = "https://biquote.io/api/XAUUSD/ohlc"
          collected = {}
          end = None
          for page in range(10):
              params = {"interval": "1m", "limit": "1000"}
              if end:
                  params["to"] = end
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=45) as response:
                  payload = json.load(response)
              batch = payload.get("bars", [])
              print(f"Page {page+1}: got {len(batch)} bars; to={end}")
              if not batch:
                  break
              for bar in batch:
                  collected[bar["openTime"]] = bar
              earliest = min(datetime.fromisoformat(x["openTime"].replace("Z","+00:00")) for x in batch)
              next_end = (earliest - timedelta(seconds=1)).isoformat(timespec="seconds").replace("+00:00","Z")
              if next_end == end:
                  break
              end = next_end
              if len(collected) >= 6000:
                  break
          print(f"TOTAL UNIQUE 1m BARS: {len(collected)}")
          if len(collected) < 6000:
              raise SystemExit(f"Could only retrieve {len(collected)} unique bars; need 6000")
          print("PASS: 6000 unique XAUUSD one-minute bars retrieved.")
          PY
      - name: Check latest XAUUSD quote API
        run: |
          curl -fsSL --max-time 30 "https://biquote.io/api/XAUUSD?allowStale=true" -o /tmp/xauusd-quote.json
          python - <<'PY'
          import json
          q = json.load(open("/tmp/xauusd-quote.json", encoding="utf-8"))
          if q.get("symbol") != "XAUUSD" or not isinstance(q.get("mid"), (int, float)):
              raise SystemExit(f"Unexpected quote response: {q}")
          print(f"PASS: XAUUSD quote received; mid={q['mid']}; state={q.get('marketState')}")
          PY
