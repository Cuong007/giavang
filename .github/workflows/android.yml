name: Build Gold Analyzer Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          mkdir -p www/data
          cp data/xauusd-1m.json www/data/xauusd-1m.json

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package source ZIP
        run: |
          zip -r gold-analyzer-source.zip index.html README.md package.json capacitor.config.json data/xauusd-1m.json scripts/update-history.py

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gold-analyzer-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            gold-analyzer-source.zip
          if-no-files-found: error
          retention-days: 30
