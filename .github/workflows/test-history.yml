name: Test XAUUSD 6000 M1 history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-history.yml'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Yahoo Finance one-minute gold history
        run: |
          python - <<'PY'
          import json, urllib.request
          for symbol in ["XAUUSD=X", "GC=F"]:
              url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?range=7d&interval=1m"
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      payload = json.load(response)
                  result = payload["chart"]["result"][0]
                  timestamps = result.get("timestamp", [])
                  quote = result["indicators"]["quote"][0]
                  print(f"{symbol}: {len(timestamps)} bars; currency={result.get('meta',{}).get('currency')}; exchange={result.get('meta',{}).get('exchangeName')}")
                  if timestamps:
                      print("range", timestamps[0], timestamps[-1], "sample", quote["close"][-1])
              except Exception as e:
                  print(f"{symbol}: FAILED {type(e).__name__}: {e}")
          PY
