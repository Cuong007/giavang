name: Test XAUUSD 6000 M1 history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-history.yml'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare spot MT5 and Yahoo COMEX gold history
        run: |
          python - <<'PY'
          import json, urllib.request, statistics
          bq = json.load(urllib.request.urlopen("https://biquote.io/api/XAUUSD/ohlc?interval=1m&limit=1000", timeout=45))
          spot = {int(__import__("datetime").datetime.fromisoformat(x["openTime"].replace("Z","+00:00")).timestamp()): x for x in bq.get("bars",[])}
          req = urllib.request.Request("https://query2.finance.yahoo.com/v8/finance/chart/GC%3DF?range=7d&interval=1m", headers={"User-Agent":"Mozilla/5.0"})
          y = json.load(urllib.request.urlopen(req, timeout=45))["chart"]["result"][0]
          q = y["indicators"]["quote"][0]
          yahoo = {int(t): {"open":q["open"][i],"high":q["high"][i],"low":q["low"][i],"close":q["close"][i]} for i,t in enumerate(y["timestamp"]) if q["close"][i] is not None}
          overlap = sorted(set(spot)&set(yahoo))
          diffs = [float(spot[t]["close"])-float(yahoo[t]["close"]) for t in overlap]
          print(f"BiQuote spot bars={len(spot)}; Yahoo GC=F bars={len(yahoo)}; overlap={len(overlap)}")
          if diffs:
              print(f"Spot minus futures median={statistics.median(diffs):.4f}; min={min(diffs):.4f}; max={max(diffs):.4f}")
              print(f"Latest overlap spot={spot[overlap[-1]]['close']}; GC=F={yahoo[overlap[-1]]['close']}")
          print(f"Yahoo UTC range={min(yahoo)}..{max(yahoo)}")
          if len(yahoo) < 6000:
              raise SystemExit("Yahoo did not provide 6000 1m candles")
          PY
