name: Test XAUUSD 6000 M1 history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-history.yml'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 6000 bars in pages
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timedelta
          base = "https://biquote.io/api/XAUUSD/ohlc"
          collected = {}
          end = None
          for page in range(10):
              params = {"interval": "1m", "limit": "1000"}
              if end:
                  params["to"] = end
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=45) as response:
                  payload = json.load(response)
              batch = payload.get("bars", [])
              print(f"Page {page+1}: {len(batch)} bars; to={end}")
              if not batch:
                  break
              for bar in batch:
                  collected[bar["openTime"]] = bar
              earliest = min(datetime.fromisoformat(x["openTime"].replace("Z","+00:00")) for x in batch)
              end = (earliest - timedelta(seconds=1)).isoformat(timespec="seconds").replace("+00:00","Z")
              if len(collected) >= 6000:
                  break
          print(f"TOTAL UNIQUE BARS: {len(collected)}")
          if len(collected) < 6000:
              raise SystemExit("API pagination did not provide 6000 unique bars")
          PY
